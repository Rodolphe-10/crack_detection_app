[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crack-detection-app"
version = "1.0.0"
description = "Application Streamlit professionnelle pour la détection et segmentation de fissures dans les structures en béton"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Développeur", email = "dev@example.com"}
]
maintainers = [
    {name = "Développeur", email = "dev@example.com"}
]
keywords = [
    "computer-vision",
    "deep-learning",
    "crack-detection",
    "concrete-inspection",
    "streamlit",
    "pytorch",
    "opencv",
    "segmentation",
    "classification"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "streamlit>=1.28.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "albumentations>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "pandas>=2.0.0",
    "groq>=0.4.0",
    "reportlab>=4.0.0",
    "python-docx>=0.8.11",
    "streamlit-webrtc>=0.47.0",
    "streamlit-option-menu>=0.3.6",
    "streamlit-chat>=0.1.1",
    "extra-streamlit-components>=0.1.60",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=1.0.0",
]
gpu = [
    "torch[cuda]>=2.0.0",
    "torchvision[cuda]>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/username/crack-detection-app"
Documentation = "https://github.com/username/crack-detection-app#readme"
Repository = "https://github.com/username/crack-detection-app.git"
"Bug Tracker" = "https://github.com/username/crack-detection-app/issues"

[project.scripts]
crack-detection = "crack_detection_app.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crack_detection_app*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"crack_detection_app" = [
    "assets/**/*",
    "models/**/*",
    "*.md",
    "*.txt",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["crack_detection_app"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "torch.*",
    "torchvision.*",
    "cv2.*",
    "albumentations.*",
    "groq.*",
    "reportlab.*",
    "streamlit_webrtc.*",
    "streamlit_option_menu.*",
    "streamlit_chat.*",
    "extra_streamlit_components.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=crack_detection_app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["crack_detection_app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
